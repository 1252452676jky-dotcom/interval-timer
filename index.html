<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<title>Interval Timer</title>
<style>
:root{--bg:#121418;--card:#1c1f26;--card2:#252a33;--line:#2f3540;--text:#e9edf3;--mut:#8b94a3;--acc:#4f8cff;--danger:#ff5a5f;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body.timing{overflow:hidden}
#app{max-width:780px;margin:0 auto;padding:4px 14px 80px}
.top{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5}
.top h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{filter:brightness(1.15)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.dan{color:var(--danger)}
button.dfill{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
button.ic{padding:7px 10px;min-width:38px}
button.ghost{background:transparent;border-color:transparent}
.sec{margin:20px 0 8px;display:flex;align-items:center;gap:4px}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0;flex:1}
.sec button{padding:6px 10px;font-size:14px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
.card>.row:first-child,.card>.field:first-child{border-top:none}
.row .main{flex:1;min-width:0;cursor:pointer}
.row .main.nolink{cursor:default}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mut);margin-top:2px}
.stripe{width:6px;align-self:stretch;border-radius:4px;flex:none;min-height:34px}
.play{background:var(--acc);border:none;color:#fff;width:40px;height:40px;border-radius:50%;padding:0;flex:none;display:inline-flex;align-items:center;justify-content:center}
.empty{padding:14px;color:var(--mut);font-size:14px}
/* action icons: duplicate · delete · drag, spaced apart for fingers */
.acts{display:flex;align-items:center;gap:14px;margin-left:6px;flex:none}
.act{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--mut);cursor:pointer}
.act:hover{background:var(--card2);color:var(--text);filter:none}
.act svg{pointer-events:none}
.act.del{color:var(--danger)}
.act.handle{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drow.dragging{background:var(--card2);box-shadow:0 8px 24px rgba(0,0,0,.55);position:relative;z-index:3}
body.dragging-active,body.dragging-active *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.drow.flash{animation:flash 1.1s ease}
@keyframes flash{from{background:#2d4a7a}to{background:var(--card)}}
.field{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.field .lbl{flex:1;min-width:140px;color:var(--mut)}
input[type=text],select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
input[type=text]{flex:2}
select.grow{flex:1}
.dur{display:inline-flex;align-items:center;gap:3px;flex:none}
.dur b{color:var(--mut)}
.dur input,.num{width:52px;font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.sw{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#444b57;border-radius:20px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{transform:translateX(20px)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0}
.swatch.on{border-color:#fff}
input[type=color]{width:34px;height:34px;border:none;background:none;padding:0;cursor:pointer;flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns button{flex:1;min-width:120px}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;padding:7px 14px}
.seg button.on{background:var(--acc);color:#fff}
.fold-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;cursor:pointer;background:var(--card2);min-height:52px}
.fold-h .t{flex:1;font-weight:700}
.badge{font-size:12px;color:var(--mut)}
.preview{border-radius:var(--r);padding:22px;text-align:center;margin-bottom:12px}
.preview .pn{font-size:26px;font-weight:800}
.preview .pt{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:120px}
/* modal popups */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(380px,100%);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{margin:0 0 8px;font-size:18px;word-break:break-word}
.modal p{margin:0 0 16px;color:var(--mut);line-height:1.4}
.modal input[type=text]{display:block;width:100%;margin:8px 0 16px}
.mbtns{display:flex;gap:12px;justify-content:flex-end;margin-top:8px}
.mbtns button{min-width:100px}
.menu button{display:block;width:100%;text-align:left;margin-top:10px;padding:12px 14px}
/* timer */
#timer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;transition:background-color .35s,color .35s;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.tt-top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.tt-title{flex:1;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tCount{opacity:.8;font-variant-numeric:tabular-nums}
.tbtn{background:rgba(0,0,0,.18);border:none;color:inherit;display:inline-flex;align-items:center;justify-content:center}
.tt-body{flex:1;display:flex;min-height:0}
.tt-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 16px;min-width:0}
.tt-label{font-size:clamp(28px,7vw,56px);font-weight:800;line-height:1.1;word-break:break-word}
.tt-sub{font-size:clamp(16px,4vw,24px);opacity:.85;min-height:1.3em;margin-top:6px}
.tt-time{font-size:clamp(84px,26vw,220px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin:14px 0;cursor:pointer;user-select:none}
.tt-bar{width:min(520px,90%);height:8px;background:rgba(0,0,0,.2);border-radius:8px;overflow:hidden}
.tt-bar i{display:block;height:100%;background:currentColor;width:0;transition:width .1s linear}
.tt-next{margin-top:16px;font-size:18px;opacity:.9}
.tt-stats{margin-top:6px;font-size:14px;opacity:.75;font-variant-numeric:tabular-nums}
.tt-ctrl{display:flex;gap:22px;align-items:center;margin-top:26px}
.tt-ctrl .tbtn{width:60px;height:60px;border-radius:50%;padding:0}
.tt-ctrl .big{width:88px;height:88px}
.tt-list{display:none;width:340px;overflow-y:auto;background:rgba(0,0,0,.6);color:#fff}
.tt-list.show{display:block}
.tl{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
.tl i{width:10px;height:28px;border-radius:3px;flex:none}
.tl span{flex:1;min-width:0}
.tl small{opacity:.65}
.tl b{font-weight:500;font-variant-numeric:tabular-nums}
.tl.past{opacity:.4}
.tl.cur{background:rgba(255,255,255,.2)}
@media(max-width:760px){.tt-body{flex-direction:column}.tt-list{width:auto;max-height:34vh}}
@media(max-width:420px){#app{padding-left:10px;padding-right:10px}.row{padding:10px}.dur input{width:42px}.acts{gap:12px}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
/* ================= constants & helpers ================= */
const KEY = 'intervalTimer.v1';
const PALETTE = ['#e53935','#1e88e5','#43a047','#8e24aa','#f4511e','#3949ab','#d81b60','#00897b','#6d4c41','#7cb342','#5e35b1','#fb8c00'];
const WARM = '#fdd835', COOL = '#26c6da', REST = '#455a64';
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DEF = {tts:true, voice:'', rate:1, volume:1, countdown:'beep', startBeep:true, announceNext:true, announceSets:true,
             defaultRest:15, warmup:10, cooldown:10, restColor:REST, wakeLock:true};
const svg = (d, s=20) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path fill="currentColor" d="${d}"/></svg>`;
const IC = {
  play: svg('M8 5v14l11-7z',38), playS: svg('M8 5v14l11-7z',20),
  pause: svg('M6 5h4v14H6zm8 0h4v14h-4z',38),
  prev: svg('M6 6h2v12H6zm3.5 6 8.5 6V6z',28), next: svg('M16 6h2v12h-2zM6 18l8.5-6L6 6z',28),
  replay: svg('M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z',38),
  copy: svg('M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z'),
  trash: svg('M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5-1-1h-5l-1 1H5v2h14V4h-3.5z'),
  grip: svg('M11 18a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM9 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 4a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z',22),
  edit: svg('M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'),
  plus: svg('M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',22),
  more: svg('M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z',22),
  close: svg('M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z')
};
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (arr, id) => arr.find(x => x.id === id);
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const fg = hex => { const n = parseInt((hex||'#000').slice(1),16); const r=n>>16&255, g=n>>8&255, b=n&255;
  return (0.299*r + 0.587*g + 0.114*b) > 160 ? '#111' : '#fff'; };

let S = null;              // all app data
let V = {name:'home'};     // current view

/* ================= storage (swap these two functions for Firebase later) ================= */
let MEM = null;
const Store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return MEM; } },
  save(data){
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){ MEM = data; console.warn('Browser storage unavailable – changes will not persist after reload.', e); }
  }
};
function save(){ Store.save(S); }
function blank(){ return {version:1, settings:{...DEF}, folders:[], workouts:[], combos:[], schedule:{}}; }

function normalize(){
  S.settings = {...DEF, ...(S.settings||{})};
  S.folders = S.folders || []; S.workouts = S.workouts || []; S.combos = S.combos || []; S.schedule = S.schedule || {};
  for (let d=0; d<7; d++) S.schedule[d] = S.schedule[d] || [];
  S.workouts.forEach(w => {
    w.items = w.items || [];
    w.warmup = {enabled:true, duration:10, color:WARM, ...(w.warmup||{})};
    w.cooldown = {enabled:true, duration:10, color:COOL, ...(w.cooldown||{})};
    if (w.defaultRest == null) w.defaultRest = 15;
    w.items.forEach((it,i) => { if (it.type !== 'rest') w.items[i] = {...exBase(it.type,'',PALETTE[0]), ...it}; });
  });
  S.combos.forEach(c => { c.workoutIds = c.workoutIds || []; if (c.gap == null) c.gap = 0; if (c.skipInner == null) c.skipInner = true; });
}

/* ================= model factories ================= */
function newWorkout(name, folderId){
  return {id:uid(), name:name||'New workout', folderId:folderId||null, defaultRest:S.settings.defaultRest,
    warmup:{enabled:true, duration:S.settings.warmup, color:WARM},
    cooldown:{enabled:true, duration:S.settings.cooldown, color:COOL}, items:[]};
}
function exBase(type, name, color){
  return {id:uid(), type, name, color, duration:30, sets:3, setRest:10, sides:false, left:30, right:30, sideRest:5};
}
function restItem(d){ return {id:uid(), type:'rest', duration:d}; }
// pick a palette color not used in this workout, starting after `after`
function pickColor(w, after){
  const used = new Set(w.items.filter(i => i.type !== 'rest').map(i => i.color));
  const start = PALETTE.indexOf(after);
  for (let k=1; k<=PALETTE.length; k++){ const c = PALETTE[(start+k+PALETTE.length) % PALETTE.length]; if (!used.has(c) && c !== after) return c; }
  return PALETTE[(start+1+PALETTE.length) % PALETTE.length];
}
function nextColor(w){
  const ex = w.items.filter(i => i.type !== 'rest');
  return pickColor(w, ex.length ? ex[ex.length-1].color : null);
}
function addItem(w, type){
  if (type !== 'rest' && w.items.length && w.items[w.items.length-1].type !== 'rest' && w.defaultRest > 0)
    w.items.push(restItem(w.defaultRest));
  const it = type === 'rest' ? restItem(w.defaultRest || 15) : exBase(type, 'New exercise', nextColor(w));
  w.items.push(it);
  return it;
}
// after removing an exercise at index i, remove a leftover double/leading/trailing rest
function tidyRests(w, i){
  const a = w.items;
  if (i > 0 && a[i-1] && a[i-1].type === 'rest' && (i >= a.length || a[i].type === 'rest')) a.splice(i-1,1);
  else if (i === 0 && a[0] && a[0].type === 'rest') a.splice(0,1);
}
function seed(){
  const fAbs={id:uid(),name:'Abs'}, fWarm={id:uid(),name:'Warm up & Stretch'}, fStr={id:uid(),name:'Strength'};
  S.folders.push(fWarm, fAbs, fStr);
  const mk = (w,type,name,p) => Object.assign(addItem(w,type), {name}, p||{});
  const abs = newWorkout('Abs basic', fAbs.id); abs.defaultRest = 15;
  mk(abs,'single','Leg raises',{duration:40}); mk(abs,'single','Bicycle',{duration:40});
  const warm = newWorkout('Stretch warm up', fWarm.id); warm.defaultRest = 5;
  mk(warm,'single','Arm stretch',{duration:30}); mk(warm,'single','Leg stretch',{duration:30});
  mk(warm,'single','Hip flexor stretch',{sides:true,left:30,right:30,sideRest:5});
  const str = newWorkout('Full body sets', fStr.id); str.defaultRest = 10;
  ['Push-up','Squat','Sit-up'].forEach(n => mk(str,'multi',n,{sets:3,duration:30,setRest:10}));
  S.workouts.push(warm, abs, str);
  const combo = {id:uid(), name:'Warm up + Abs', workoutIds:[warm.id, abs.id], skipInner:true, gap:10};
  S.combos.push(combo);
  [1,3,5].forEach(d => S.schedule[d] = [{t:'w', id:str.id}]);
  [2,4].forEach(d => S.schedule[d] = [{t:'c', id:combo.id}]);
}

/* ================= segment builder ================= */
function exSegs(it, sub, sayBase){
  const rc = S.settings.restColor, out = [];
  const j = (a,b) => [a,b].filter(Boolean).join(' · ');
  if (!it.sides) out.push({label:it.name, sub, dur:it.duration, color:it.color, kind:'work', say:sayBase});
  else {
    out.push({label:it.name, sub:j(sub,'Left'), dur:it.left, color:it.color, kind:'work', say:sayBase + ', left side'});
    if (it.sideRest > 0) out.push({label:'Switch sides', sub:it.name, dur:it.sideRest, color:rc, kind:'switch', say:'Switch sides'});
    out.push({label:it.name, sub:j(sub,'Right'), dur:it.right, color:it.color, kind:'work', say:'Right side'});
  }
  return out;
}
function workoutSegs(w, opt={}){
  const st = S.settings, segs = [];
  if (w.warmup.enabled && !opt.noWarm) segs.push({label:'Warm up', sub:w.name, dur:w.warmup.duration, color:w.warmup.color, kind:'warm', say:'Warm up'});
  for (const it of w.items){
    if (it.type === 'rest') segs.push({label:'Rest', sub:'', dur:it.duration, color:st.restColor, kind:'rest', say:'Rest'});
    else if (it.type === 'single') segs.push(...exSegs(it, '', it.name));
    else for (let s=1; s<=it.sets; s++){
      segs.push(...exSegs(it, it.sets>1 ? `Set ${s} of ${it.sets}` : '', st.announceSets && it.sets>1 ? `${it.name}, set ${s}` : it.name));
      if (s < it.sets && it.setRest > 0)
        segs.push({label:'Rest', sub:`Next: set ${s+1} of ${it.sets}`, dur:it.setRest, color:st.restColor, kind:'rest', say:'Rest'});
    }
  }
  if (w.cooldown.enabled && !opt.noCool) segs.push({label:'Cool down', sub:w.name, dur:w.cooldown.duration, color:w.cooldown.color, kind:'cool', say:'Cool down'});
  return segs.filter(s => s.dur > 0);
}
function comboSegs(c){
  const ws = c.workoutIds.map(id => byId(S.workouts,id)).filter(Boolean), segs = [];
  ws.forEach((w,i) => {
    if (i>0 && c.gap>0) segs.push({label:'Rest', sub:'Next workout: '+w.name, dur:c.gap, color:S.settings.restColor, kind:'rest', say:'Rest. Next workout, '+w.name});
    segs.push(...workoutSegs(w, {noWarm:c.skipInner && i>0, noCool:c.skipInner && i<ws.length-1}));
  });
  return segs;
}
function finalize(segs){
  if (S.settings.announceNext) segs.forEach((s,i) => {
    const n = segs[i+1];
    if (!n || n.kind !== 'work') return;
    if (s.say === 'Rest') s.say = `Rest. Next, ${n.label}`;
    if (s.kind === 'warm') s.say = `Warm up. First up, ${n.label}`;
  });
  return segs;
}
const sum = segs => segs.reduce((a,s) => a+s.dur, 0);
const totalW = w => sum(workoutSegs(w));
const totalC = c => sum(comboSegs(c));
const colorsW = w => w.items.filter(x => x.type !== 'rest').map(x => x.color);
const colorsC = c => c.workoutIds.flatMap(id => { const w = byId(S.workouts,id); return w ? colorsW(w) : []; }).slice(0,8);
const stripeBg = cols => cols.length > 1 ? `linear-gradient(180deg,${cols.join(',')})` : (cols[0] || '#555');
const unfiled = () => S.workouts.filter(w => !w.folderId || !byId(S.folders, w.folderId));
const resolveRef = r => r.t === 'c' ? byId(S.combos, r.id) : byId(S.workouts, r.id);
function summary(it){
  const work = it.sides ? `L ${fmt(it.left)} · switch ${fmt(it.sideRest)} · R ${fmt(it.right)}` : fmt(it.duration);
  return it.type === 'multi' ? `${it.sets} sets × ${it.sides ? '(' + work + ')' : work} · ${fmt(it.setRest)} rest between sets` : work;
}
function itemTime(it){ const w = it.sides ? it.left + it.sideRest + it.right : it.duration;
  return it.type === 'multi' ? it.sets*w + Math.max(0,it.sets-1)*it.setRest : w; }

/* ================= popups (replace browser confirm/prompt/alert) ================= */
let MODAL = null;
function showModal(inner, onCancel){
  if (MODAL) MODAL.cancel();
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg && MODAL) MODAL.cancel(); });
  document.body.appendChild(bg);
  MODAL = {bg, cancel(){ closeModal(); onCancel(); }};
  return bg;
}
function closeModal(){ if (MODAL){ MODAL.bg.remove(); MODAL = null; } }
const Dialog = {
  confirm(title, msg, ok='Delete', danger=true){
    return new Promise(res => {
      const bg = showModal(`<h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}<div class="mbtns"><button data-r="0">Cancel</button><button data-r="1" class="${danger ? 'dfill' : 'pri'}">${esc(ok)}</button></div>`, () => res(false));
      bg.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { closeModal(); res(b.dataset.r === '1'); });

    });
  },
  alert(title, msg){
    return new Promise(res => {
      const bg = showModal(`<h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}<div class="mbtns"><button class="pri" data-r="1">OK</button></div>`, () => res());
      bg.querySelector('[data-r]').onclick = () => { closeModal(); res(); };
    });
  },
  prompt(title, value='', ok='Save'){
    return new Promise(res => {
      const bg = showModal(`<h3>${esc(title)}</h3><input type="text" value="${esc(value)}"><div class="mbtns"><button data-r="0">Cancel</button><button class="pri" data-r="1">${esc(ok)}</button></div>`, () => res(null));
      const inp = bg.querySelector('input');
      const done = () => { const v = inp.value.trim(); closeModal(); res(v || null); };
      bg.querySelector('[data-r="0"]').onclick = () => { closeModal(); res(null); };
      bg.querySelector('[data-r="1"]').onclick = done;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); done(); } });
      setTimeout(() => { inp.focus(); inp.select(); }, 30);

  },
  menu(title, opts){

      const bg = showModal(`<h3>${esc(title)}</h3><div class="menu">${opts.map((o,i) => `<button data-i="${i}" class="${o.danger ? 'dan' : ''}">${esc(o.label)}</button>`).join('')}<button data-i="-1">Cancel</button></div>`, () => res(null));

    });
  }

/* ================= drag to reorder (mouse + touch) ================= */
let DR = null;
function dragStart(e, kind){
  if (DR || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const row = e.target.closest('.drow'); if (!row) return;
  e.preventDefault();
  DR = {row, list:row.parentNode, kind, pid:e.pointerId, y:e.clientY, iv:null};
  row.classList.add('dragging');
  document.body.classList.add('dragging-active');
  addEventListener('pointermove', dragMove, {passive:false});
  addEventListener('pointerup', dragEnd);
  addEventListener('pointercancel', dragEnd);
  DR.iv = setInterval(autoScroll, 16);
}
function dragMove(e){
  if (!DR || e.pointerId !== DR.pid) return;
  e.preventDefault();
  DR.y = e.clientY;
  reposition();
}
function reposition(){
  const {row, list, y} = DR;
  const rows = [...list.querySelectorAll('.drow')].filter(r => r !== row);
  let before = null;
  for (const r of rows){ const b = r.getBoundingClientRect(); if (y < b.top + b.height/2){ before = r; break; } }
  if (before){ if (row.nextElementSibling !== before) list.insertBefore(row, before); }
  else if (list.lastElementChild !== row) list.appendChild(row);
}
function autoScroll(){
  if (!DR) return;
  const y = DR.y, top = 110, bottom = innerHeight - 70; let d = 0;
  if (y < top) d = -Math.ceil((top - y) / 5); else if (y > bottom) d = Math.ceil((y - bottom) / 5);
  if (d){ scrollBy(0, d); reposition(); }
}
function dragEnd(e){
  if (!DR || e.pointerId !== DR.pid) return;
  const {row, list, kind} = DR;
  clearInterval(DR.iv); DR = null;
  removeEventListener('pointermove', dragMove); removeEventListener('pointerup', dragEnd); removeEventListener('pointercancel', dragEnd);
  row.classList.remove('dragging'); document.body.classList.remove('dragging-active');
  const order = [...list.querySelectorAll('.drow')].map(r => +r.dataset.idx);
  const owner = kind === 'combo' ? byId(S.combos, V.id) : cw();
  const arr = owner ? (kind === 'combo' ? owner.workoutIds : owner.items) : null;
  if (arr && order.length === arr.length && order.some((v,i) => v !== i)){
    const next = order.map(k => arr[k]); arr.splice(0, arr.length, ...next); save();
  }
  render();
}

/* ================= audio + TTS ================= */
let AC = null, VOICES = [], WL = null;
function audio(){
  if (!AC){ const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq=880, dur=.12, vol=.3){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function loadVoices(){ if ('speechSynthesis' in window) VOICES = speechSynthesis.getVoices(); }
function speak(text){
  if (!S.settings.tts || !('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = VOICES.find(v => v.voiceURI === S.settings.voice);
  if (v){ u.voice = v; u.lang = v.lang; }
  u.rate = S.settings.rate; u.volume = S.settings.volume;
  speechSynthesis.speak(u);
}
async function wake(){ if (!S.settings.wakeLock || !('wakeLock' in navigator)) return; try { WL = await navigator.wakeLock.request('screen'); } catch(e){} }
function releaseWake(){ if (WL){ WL.release().catch(()=>{}); WL = null; } }

/* ================= timer engine ================= */
const T = {segs:[], before:[], i:0, rem:0, end:0, running:false, cued:false, done:false, title:'', total:0, iv:null, lastSec:0, showList:innerWidth>760};
function openTimer(kind, id){
  const src = kind === 'c' ? byId(S.combos,id) : byId(S.workouts,id); if (!src) return;
  const segs = finalize(kind === 'c' ? comboSegs(src) : workoutSegs(src));
  if (!segs.length){ Dialog.alert('Nothing to run', 'This workout has no timed intervals yet.'); return; }
  let acc = 0; const before = segs.map(s => { const b = acc; acc += s.dur; return b; });
  Object.assign(T, {segs, before, i:0, rem:segs[0].dur*1000, running:false, cued:false, done:false, title:src.name, total:acc});
  go('timer');
}
function startCue(){ T.cued = true; if (S.settings.startBeep) beep(1046,.3); speak(T.segs[T.i].say); }
function tick(){
  if (!T.running) return;
  const now = performance.now();
  T.rem = T.end - now;
  const sec = Math.ceil(T.rem/1000);
  if (sec !== T.lastSec){
    T.lastSec = sec;
    if (sec >= 1 && sec <= 3 && T.rem > 0){
      if (S.settings.countdown === 'beep') beep(784,.1);
      else if (S.settings.countdown === 'voice') speak(String(sec));
    }
  }
  let changed = false;
  while (T.rem <= 0){
    T.i++;
    if (T.i >= T.segs.length){ finish(); return; }
    T.end += T.segs[T.i].dur*1000; T.rem = T.end - now; T.lastSec = Math.ceil(T.rem/1000); changed = true;
  }
  if (changed) startCue();
  updateTimerUI(changed);
}
function startRun(){ T.running = true; T.end = performance.now() + T.rem; T.lastSec = Math.ceil(T.rem/1000);
  if (!T.cued) startCue(); clearInterval(T.iv); T.iv = setInterval(tick, 100); wake(); }
function pauseRun(){ T.running = false; T.rem = T.end - performance.now(); clearInterval(T.iv); releaseWake(); }
function stopTimer(){ T.running = false; clearInterval(T.iv); releaseWake(); if ('speechSynthesis' in window) speechSynthesis.cancel(); }
function jump(i){
  T.done = false; T.i = Math.max(0, Math.min(T.segs.length-1, i));
  T.rem = T.segs[T.i].dur*1000; T.lastSec = Math.ceil(T.rem/1000); T.cued = false;
  if (T.running){ T.end = performance.now() + T.rem; startCue(); }
  updateTimerUI(true);
}
function finish(){
  T.running = false; clearInterval(T.iv); T.done = true; T.rem = 0; releaseWake();
  beep(660,.15); setTimeout(()=>beep(880,.15),180); setTimeout(()=>beep(1320,.4),360);
  speak('Workout complete. Great job!');
  updateTimerUI(true);
}
function updateTimerUI(full){
  const root = document.getElementById('timer'); if (!root) return;
  const $ = id => document.getElementById(id);
  if (T.done){
    if (full){ root.style.background = '#2e7d32'; root.style.color = '#fff';
      $('tLabel').textContent = 'Workout complete'; $('tSub').textContent = T.title; $('tNext').textContent = 'Nice work!';
      $('tPlay').innerHTML = IC.replay; $('tCount').textContent = ''; $('tBar').style.width = '100%'; markList(T.segs.length); }
    $('tTime').textContent = fmt(T.total); $('tStats').textContent = 'Total ' + fmt(T.total);
    return;
  }
  const s = T.segs[T.i], rem = Math.max(0, T.rem);
  $('tTime').textContent = fmt(Math.ceil(rem/1000));
  $('tBar').style.width = Math.min(100, 100 - rem/(s.dur*10)).toFixed(2) + '%';
  const el = T.before[T.i] + s.dur - rem/1000;
  $('tStats').textContent = `Elapsed ${fmt(el)} · Remaining ${fmt(T.total - el)}`;
  if (full){
    root.style.background = s.color; root.style.color = fg(s.color);
    $('tLabel').textContent = s.label; $('tSub').textContent = s.sub || '';
    const n = T.segs[T.i+1];
    $('tNext').textContent = n ? `Next: ${n.label}${n.sub ? ' (' + n.sub + ')' : ''} · ${fmt(n.dur)}` : 'Last interval';
    $('tCount').textContent = `${T.i+1} / ${T.segs.length}`;
    $('tPlay').innerHTML = T.running ? IC.pause : IC.play;
    if (!T.running && !T.cued && T.i === 0 && rem === s.dur*1000) $('tNext').textContent = 'Tap play to start';
    markList(T.i);
  }
}
function markList(i){
  document.querySelectorAll('.tl').forEach(n => { const k = +n.dataset.i; n.classList.toggle('cur', k===i); n.classList.toggle('past', k<i); });
  const cur = document.querySelector('.tl.cur');
  if (cur && T.showList) cur.scrollIntoView({block:'nearest'});
}

    <div class="field"><span class="lbl">Rest between workouts</span>${dur('c','gap',c.gap)}</div>
  </div>
  <div class="sec"><h2>Workouts in order · ${fmt(totalC(c))}</h2></div>
  <div class="card"><div id="dlist">${rows || '<div class="empty">Add two or more workouts. The original workouts stay in their folders.</div>'}</div><div class="field">${refSelect('A.comboAdd(this.value)', true)}</div></div>
  <div class="btns"><button class="dan" onclick="A.delCombo()">Delete combo</button></div>`;
}

function vSchedule(){
  const today = new Date().getDay();
  return topBar('Weekly schedule') + [1,2,3,4,5,6,0].map(d => `
    <div class="sec"><h2 ${d===today?'style="color:var(--acc)"':''}>${DAYS[d]}${d===today?' · today':''}</h2></div>
    <div class="card">${S.schedule[d].map((r,i) => { const o = resolveRef(r); if (!o) return '';
      return `<div class="row"><div class="stripe" style="background:${stripeBg(r.t==='c'?colorsC(o):colorsW(o))}"></div><div class="main nolink"><div class="t">${esc(o.name)}</div><div class="s">${r.t==='c'?'Combo':'Workout'} · ${fmt(r.t==='c'?totalC(o):totalW(o))}</div></div>
        <div class="acts"><button class="act del" onclick="A.schedDel(${d},${i})" title="Remove" aria-label="Remove">${IC.close}</button></div></div>`; }).join('')}
      <div class="field">${refSelect(`A.schedAdd(${d},this.value)`)}</div></div>`).join('');
}

function vSettings(){
  const st = S.settings;
  const vs = [...VOICES].sort((a,b) => a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));
  return topBar('Settings') + `
  <div class="sec"><h2>Voice (text-to-speech)</h2></div>
  <div class="card">
    ${swField('Speak exercise names and "rest"','s','tts',st.tts)}
    <div class="field"><span class="lbl">Voice</span><select class="grow" onchange="A.set('s','voice',this.value,true)"><option value="">System default</option>${vs.map(v => `<option value="${esc(v.voiceURI)}" ${v.voiceURI===st.voice?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Speed</span><input type="range" min="0.6" max="1.6" step="0.1" value="${st.rate}" oninput="A.set('s','rate',+this.value,true);this.nextElementSibling.textContent=this.value+'×'"><span>${st.rate}×</span></div>
    ${swField('Announce next exercise during rest','s','announceNext',st.announceNext)}
    ${swField('Announce set numbers','s','announceSets',st.announceSets)}
    <div class="field"><button onclick="A.testVoice()">Test voice</button></div>
  </div>
  <div class="sec"><h2>Sounds &amp; screen</h2></div>
  <div class="card">
    <div class="field"><span class="lbl">Last 3 seconds countdown</span><div class="seg">${['beep','voice','off'].map(m => `<button class="${st.countdown===m?'on':''}" onclick="A.set('s','countdown','${m}')">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>
    ${swField('Beep when an interval starts','s','startBeep',st.startBeep)}
    ${swField('Keep screen awake while running','s','wakeLock',st.wakeLock)}
  </div>
  <div class="sec"><h2>Defaults for new workouts</h2></div>
  <div class="card">
    <div class="field"><span class="lbl">Rest between exercises</span>${dur('s','defaultRest',st.defaultRest)}</div>
    <div class="field"><span class="lbl">Warm up</span>${dur('s','warmup',st.warmup)}</div>
    <div class="field"><span class="lbl">Cool down</span>${dur('s','cooldown',st.cooldown)}</div>
    <div class="field"><span class="lbl">Rest panel color</span><input type="color" value="${st.restColor}" onchange="A.set('s','restColor',this.value)"></div>
  </div>
  <div class="sec"><h2>Backup</h2></div>
  <div class="card"><div class="field"><span class="lbl">Save everything as a JSON file, then import it on another device or browser.</span></div>
    <div class="field"><button onclick="A.exportData()">Export JSON</button><button onclick="A.importData()">Import JSON</button><button class="dan" onclick="A.resetAll()">Erase all data</button></div></div>`;
}

function vTimer(){
  return `<div id="timer">
    <div class="tt-top"><button class="ic tbtn" onclick="A.back()" aria-label="Close">✕</button><div class="tt-title">${esc(T.title)}</div><span id="tCount"></span><button class="ic tbtn" onclick="A.toggleList()" aria-label="Interval list">☰</button></div>
    <div class="tt-body">
      <div class="tt-mid">
        <div id="tLabel" class="tt-label"></div><div id="tSub" class="tt-sub"></div>
        <div id="tTime" class="tt-time" onclick="A.toggle()"></div>
        <div class="tt-bar"><i id="tBar"></i></div>
        <div id="tNext" class="tt-next"></div><div id="tStats" class="tt-stats"></div>
        <div class="tt-ctrl"><button class="tbtn" onclick="A.prev()" aria-label="Previous">${IC.prev}</button><button id="tPlay" class="tbtn big" onclick="A.toggle()" aria-label="Play/Pause"></button><button class="tbtn" onclick="A.next()" aria-label="Next">${IC.next}</button></div>
      </div>
      <div id="tList" class="tt-list ${T.showList?'show':''}">${T.segs.map((s,i) => `<div class="tl" data-i="${i}" onclick="A.jump(${i})"><i style="background:${s.color}"></i><span>${esc(s.label)}${s.sub ? ` <small>${esc(s.sub)}</small>` : ''}</span><b>${fmt(s.dur)}</b></div>`).join('')}</div>
    </div></div>`;
}

function render(){
  let html = null;
  document.body.classList.toggle('timing', V.name === 'timer');
  if (V.name === 'workout'){ const w = cw(); if (w) html = vWorkout(w); }
  else if (V.name === 'item'){ const w = cw(), it = w && w.items.find(i => i.id === V.iid); if (it) html = vItem(w, it); }
  else if (V.name === 'combo'){ const c = byId(S.combos, V.id); if (c) html = vCombo(c); }
  else if (V.name === 'schedule') html = vSchedule();
  else if (V.name === 'settings') html = vSettings();
  else if (V.name === 'timer'){ if (T.segs.length) html = vTimer(); }
  else html = vHome();
  if (html == null){ V = {name:'home'}; history.replaceState(V,''); html = vHome(); }
  document.getElementById('app').innerHTML = html;
  if (V.name === 'timer') updateTimerUI(true);
}

/* ================= actions ================= */
const A = {
  go, back, render, dragStart,
  play: openTimer,
  set(scope, key, val, quiet){
    const o = ctx(scope); if (!o) return;
    o[key] = val; save();
    if (quiet){ if (key === 'name'){ const h = document.querySelector('.top h1'); if (h) h.textContent = val || 'Untitled'; } }
    else render();
  },
  dur(el){
    const p = el.parentNode, [m, s] = p.querySelectorAll('input');
    A.set(p.dataset.s, p.dataset.k, Math.max(0, (parseInt(m.value)||0)*60 + (parseInt(s.value)||0)));
  },
  // folders
  async newFolder(){ const n = await Dialog.prompt('New folder', '', 'Create'); if (!n) return; S.folders.push({id:uid(), name:n}); save(); render(); },
  async folderMenu(id){
    const f = byId(S.folders,id); if (!f) return;
    const v = await Dialog.menu(f.name, [{label:'New workout in this folder', v:'new'}, {label:'Rename folder', v:'ren'}, {label:'Delete folder', v:'del', danger:true}]);
    if (v === 'new') A.newWorkout(id); else if (v === 'ren') A.renameFolder(id); else if (v === 'del') A.delFolder(id);
  },
  async renameFolder(id){ const f = byId(S.folders,id); const n = await Dialog.prompt('Rename folder', f.name); if (!n) return; f.name = n; save(); render(); },
  async delFolder(id){
    const f = byId(S.folders,id);
    if (!await Dialog.confirm(`Delete folder "${f.name}"?`, 'Its workouts will move to Unfiled.')) return;
    S.workouts.forEach(w => { if (w.folderId === id) w.folderId = null; }); S.folders = S.folders.filter(x => x.id !== id); save(); render();
  },
  toggleFolder(id){ const f = byId(S.folders,id); f.collapsed = !f.collapsed; save(); render(); },
  // workouts
  newWorkout(folderId){ const w = newWorkout('New workout', folderId || null); S.workouts.push(w); save(); go('workout',{id:w.id}); },
  dupWorkout(){ const w = JSON.parse(JSON.stringify(cw())); w.id = uid(); w.name += ' (copy)'; w.items.forEach(i => i.id = uid());
    S.workouts.push(w); save(); go('workout',{id:w.id}); },
  async delWorkout(){
    const w = cw();
    if (!await Dialog.confirm(`Delete workout "${w.name}"?`, 'It will also be removed from any combos and from the weekly schedule.')) return;
    S.workouts = S.workouts.filter(x => x.id !== w.id);
    S.combos.forEach(c => c.workoutIds = c.workoutIds.filter(id => id !== w.id));
    for (let d=0; d<7; d++) S.schedule[d] = S.schedule[d].filter(r => !(r.t==='w' && r.id===w.id));
    save(); back();
  },
  applyRest(){ const w = cw(); w.items.forEach(i => { if (i.type === 'rest') i.duration = w.defaultRest; }); save(); render(); },
  addItem(type){ const w = cw(), it = addItem(w, type); save(); if (type === 'rest') render(); else go('item',{id:w.id, iid:it.id}); },
  // duplicate right below (exercises get a rest in between + a new color; no confirmation)
  dupItem(id){
    const w = cw(); if (!w) return;
    const i = w.items.findIndex(x => x.id === id); if (i < 0) return;
    const src = w.items[i], copy = {...JSON.parse(JSON.stringify(src)), id:uid()}, ins = [];
    if (src.type !== 'rest'){
      copy.color = pickColor(w, src.color);
      if (w.defaultRest > 0) ins.push(restItem(w.defaultRest));
    }
    ins.push(copy);
    w.items.splice(i+1, 0, ...ins);
    save(); render();
    const el = document.querySelector(`.drow[data-id="${copy.id}"]`); if (el) el.classList.add('flash');
  },
  async delItem(id){
    const w = cw(); if (!w) return;
    const it = w.items.find(x => x.id === id); if (!it) return;
    const title = it.type === 'rest' ? 'Delete this rest?' : `Delete "${it.name}"?`;
    const msg = it.type === 'multi' ? `All ${it.sets} sets of this exercise will be removed.` : '';
    if (!await Dialog.confirm(title, msg)) return;
    const i = w.items.findIndex(x => x.id === id); if (i < 0) return;
    w.items.splice(i,1);
    if (it.type !== 'rest') tidyRests(w, i);
    save(); if (V.name === 'item') back(); else render();
  },
  // combos
  newCombo(){ const c = {id:uid(), name:'New combo', workoutIds:[], skipInner:true, gap:0}; S.combos.push(c); save(); go('combo',{id:c.id}); },
  comboAdd(v){ if (!v) return; byId(S.combos,V.id).workoutIds.push(v.split(':')[1]); save(); render(); },
  comboDel(i){ byId(S.combos,V.id).workoutIds.splice(i,1); save(); render(); },
  async delCombo(){
    const c = byId(S.combos,V.id);
    if (!await Dialog.confirm(`Delete combo "${c.name}"?`, 'The original workouts are kept in their folders.')) return;
    S.combos = S.combos.filter(x => x.id !== c.id);
    for (let d=0; d<7; d++) S.schedule[d] = S.schedule[d].filter(r => !(r.t==='c' && r.id===c.id));
    save(); back();
  },
  // schedule
  schedAdd(d, v){ if (!v) return; const [t, id] = v.split(':'); S.schedule[d].push({t, id}); save(); render(); },
  schedDel(d, i){ S.schedule[d].splice(i,1); save(); render(); },
  // timer controls
  toggle(){
    audio();
    if (T.done){ T.done = false; T.i = 0; T.rem = T.segs[0].dur*1000; T.cued = false; }
    if (T.running) pauseRun(); else startRun();
    updateTimerUI(true);
  },
  next(){ if (T.done) return; if (T.i < T.segs.length-1) jump(T.i+1); else finish(); },
  prev(){
    if (T.done){ jump(T.segs.length-1); return; }
    const s = T.segs[T.i], rem = T.running ? T.end - performance.now() : T.rem;
    jump(s.dur*1000 - rem > 2000 || T.i === 0 ? T.i : T.i-1);
  },
  jump(i){ jump(i); },
  toggleList(){ T.showList = !T.showList; document.getElementById('tList').classList.toggle('show', T.showList); markList(T.done ? T.segs.length : T.i); },
  // settings & data
  testVoice(){ audio(); speak('Push-up, set 1. Rest. Next, Squat.'); },
  exportData(){
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `interval-timer-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  importData(){ const f = document.getElementById('importFile'); f.value = ''; f.click(); },
  async resetAll(){
    if (!await Dialog.confirm('Erase ALL data on this device?', 'Workouts, combos and schedule will be deleted. Export first if unsure.', 'Erase')) return;
    S = blank(); normalize(); save(); go('home');
  }
};
window.A = A;

/* ================= init (kept last so everything above is defined first) ================= */
S = Store.load();
if (!S || !Array.isArray(S.workouts)) { S = blank(); seed(); }
normalize(); save();

history.replaceState(V, '');
addEventListener('popstate', e => {
  if (MODAL) MODAL.cancel();
  if (V.name === 'timer') stopTimer();
  V = e.state || {name:'home'}; render();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && T.running){ wake(); tick(); } });
document.addEventListener('keydown', e => {
  if (MODAL){ if (e.key === 'Escape'){ e.preventDefault(); MODAL.cancel(); } return; }
  if (V.name !== 'timer') return;
  if (e.code === 'Space'){ e.preventDefault(); A.toggle(); }
  else if (e.key === 'ArrowRight') A.next();
  else if (e.key === 'ArrowLeft') A.prev();
  else if (e.key === 'Escape') back();
});
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (V.name === 'settings') render(); }; }
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.workouts)) throw new Error('Not a valid backup file');
      if (!await Dialog.confirm('Import backup?', `${d.workouts.length} workouts and ${(d.combos||[]).length} combos. This replaces the data on this device.`, 'Import', false)) return;
      S = d; normalize(); save(); V = {name:'home'}; history.replaceState(V,''); render();
    } catch(err){ Dialog.alert('Import failed', err.message); }
  };
  r.readAsText(file);
});

render();
</script>
</body>
</html>
